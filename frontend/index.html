<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="register-screen">

    <div class="register-container">

        <h1>Lyrica</h1>

        <p>
            Создайте аккаунт, чтобы начать пользоваться приложением
        </p>

        <input
            type="email"
            id="email-input"
            placeholder="Email"
        >

        <input
            type="text"
            id="username-input"
            placeholder="Username"
        >

        <input
            type="password"
            id="password-input"
            placeholder="Password"
        >

        <button id="register-button">
            Зарегистрироваться
        </button>

        <button id="login-button">
            Войти
        </button>

    </div>

</div>

<div id="login-screen" style="display: none;">

    <div class="register-container">

        <h1>Lyrica</h1>

        <p>
            Войдите в свой аккаунт
        </p>

        <input
            type="text"
            id="login-username-input"
            placeholder="Username"
        >

        <input
            type="password"
            id="login-password-input"
            placeholder="Password"
        >

        <button id="login-submit-button">
            Войти
        </button>

        <button id="back-button">
            Назад
        </button>

    </div>

</div>

<div class="background-glow"></div>

<main id="library-screen" style="display: none;">

    <div class="library-search">

        <input
            id="song-search"
            type="text"
            placeholder="Найдите песню..."
        >

    </div>

    <div id="tracks-list">

    </div>

</main>

<main class="player" id="player-screen" style="display: none;">
    <button id="back-to-library">
    ← Назад
    </button>

    <div id="song-content">

        <div id="player-content">

            <section class="cover-section">
                <img id="cover" src="" alt="album cover">
            </section>

            <section class="info-section">
                <h1 id="song-name">Loading...</h1>
                <h2 id="artist-name"></h2>
            </section>

            <section class="controls">
                <button id="start-btn">Start</button>
                <button id="reset-btn">Reset</button>
            </section>

            <audio id="audio"></audio>

            <section class="progress-section">
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </section>

            <section class="lyrics-section">
                <div id="lyrics"></div>
            </section>

        </div>

    </div>

</main>

<script src="player.js"></script>

</body>
</html>
